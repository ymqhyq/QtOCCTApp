# --- IFC Extension: Property Definitions ---
Property:
  name: "单个属性"
  attributes:
    PropertyName:
      type: "String"
      default: ""
      label: "属性键"
    PropertyValue:
      type: "String"
      default: ""
      label: "属性值"
    ValueType:
      type: "String"
      default: "String"
      label: "值类型"

# --- IFC Extension: Property Set Container ---
PropertySet:
  name: "属性集"
  attributes:
    SetName:
      type: "String"
      default: ""
      label: "集名称"
  children:
    Properties:
      type: "Property"
      cardinality: "0..*"

# --- Base Class for all Active Objects ---
ActiveObject:
  name: "核心对象"
  attributes:
    GlobalID:
      type: "String"
      default: ""
      label: "唯一标识"
    Name:
      type: "String"
      default: "New Object"
      label: "显示名称"
    ObjectType:
      type: "String"
      default: "Component"
      label: "对象类型"
    # --- Material & Display ---
    MaterialType:
      type: "Int"
      default: 0
      label: "显示材质(预设)"
    Color:
      type: "Int"
      default: 16777215
      label: "颜色(RGB)"
    Transparency:
      type: "Real"
      default: 0.0
      label: "透明度"
    Visibility:
      type: "Bool"
      default: true
      label: "可见性"
    DisplayMode:
      type: "Int"
      default: 1
      label: "显示模式"
    LineWidth:
      type: "Real"
      default: 1.0
      label: "线宽"
    LayerID:
      type: "Int"
      default: 0
      label: "显示层级"
    # --- Geometry & Location ---
    Geometry:
      type: "Shape"
      label: "几何外形"
    Transformation:
      type: "RealArray"
      label: "变换矩阵"
  children:
    PropertySets:
      type: "PropertySet"
      cardinality: "0..*"

# --- Bridge Pier Schema ---
BridgePier:
  parent: ActiveObject
  name: "桥墩"
  attributes:
    Height: 
      type: "Real"
      default: 15.0
      label: "高度"
    Width:
      type: "Real"
      default: 2.5
      label: "宽度"
    Depth:
      type: "Real"
      default: 6.0
      label: "厚度"
  children:
    Foundation:
      type: "PileFoundation"
      cardinality: "1"

# --- Pile Foundation Schema ---
PileFoundation:
  name: "桩基"
  attributes:
    PileDiameter:
      type: "Real"
      default: 1.5
      label: "桩径"
    PileLength:
      type: "Real"
      default: 30.0
      label: "桩长"
    PileCount:
      type: "Int"
      default: 4
      label: "桩数"
